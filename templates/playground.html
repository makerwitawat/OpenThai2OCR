<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground — OpenThai2.0 OCR</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg:#f6f8fb; --panel:#fff; --panel2:#f1f5f9; --border:#e2e8f0; --text:#0f172a;
    --muted:#64748b; --accent:#0f766e; --accent2:#14b8a6; --err:#dc2626;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);
  }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--text); min-height:100vh; font-size:15px;
    font-family:"Segoe UI","Noto Sans Thai",Leelawadee UI,system-ui,sans-serif;
    background:linear-gradient(180deg,#f8fafc 0%,#eef4f7 55%,#f8fafc 100%); }
  header { display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; padding:.9rem 1.6rem;
    border-bottom:1px solid var(--border); background:rgba(255,255,255,.9);
    backdrop-filter:blur(6px); position:sticky; top:0; z-index:20; }
  header .logo { width:2.4rem; height:2.4rem; border-radius:.6rem;
    background:linear-gradient(135deg,var(--accent2),#0ea5e9);
    display:grid; place-items:center; font-weight:800; font-size:.95rem; color:#fff; }
  header h1 { font-size:1.05rem; margin:0; line-height:1.3; }
  header small { color:var(--muted); display:block; font-weight:400; font-size:.78rem; }
  .nav { display:flex; gap:.2rem; align-items:center; margin-left:.6rem; flex-wrap:wrap; }
  .nav a { text-decoration:none; color:var(--muted); font-size:.78rem;
    padding:.3rem .55rem; border-radius:.45rem; border:1px solid transparent; }
  .nav a:hover { color:var(--accent); border-color:var(--border); background:var(--panel); }
  .nav a.act { color:#fff; background:var(--accent); border-color:var(--accent); }
  .head-actions { margin-left:auto; display:flex; gap:.4rem; align-items:center; }
  .head-actions button { border:1px solid var(--border); background:var(--panel); color:var(--text);
    border-radius:.5rem; padding:.4rem .6rem; cursor:pointer; font-size:.8rem; }
  .head-actions button:hover { border-color:var(--accent); color:var(--accent); }
  .ver { color:var(--muted); font-size:.72rem; }
  main { max-width:78rem; margin:0 auto; padding:1.3rem 1.6rem 4rem; }
  .row { display:flex; gap:1.1rem; margin-top:1rem; flex-wrap:wrap; }
  .col { flex:1; min-width:21rem; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:.9rem;
    box-shadow:var(--shadow); overflow:hidden; }
  .card > h2 { margin:0; padding:.65rem 1rem; font-size:.88rem; background:var(--panel2);
    border-bottom:1px solid var(--border); display:flex; gap:.5rem; align-items:center;
    justify-content:space-between; flex-wrap:wrap; }
  .card .body { padding:1rem; }
  .drop { border:2px dashed #cbd5e1; border-radius:.8rem; background:var(--panel2);
    padding:1.6rem 1rem; text-align:center; cursor:pointer; transition:border-color .15s,background .15s; }
  .drop.on { border-color:var(--accent2); background:#ecfdf5; }
  .drop .big { font-weight:600; margin-bottom:.3rem; }
  .drop .sub { color:var(--muted); font-size:.8rem; }
  .grid { display:grid; gap:.6rem; margin-top:.8rem; }
  label.field { display:grid; gap:.25rem; font-size:.8rem; color:var(--muted); }
  label.field select, label.field input, label.field textarea {
    font:inherit; font-size:.84rem; color:var(--text); background:var(--panel);
    border:1px solid var(--border); border-radius:.45rem; padding:.4rem .55rem; width:100%; }
  label.field textarea { min-height:5.5rem; font-family:ui-monospace,Consolas,monospace; font-size:.78rem; }
  .checks { display:flex; gap:1rem; flex-wrap:wrap; font-size:.82rem; align-items:center; }
  .checks label { display:inline-flex; gap:.35rem; align-items:center; cursor:pointer; }
  .checks input { accent-color:var(--accent); }
  .actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.9rem; }
  button.primary { background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff;
    font-weight:700; border:none; padding:.6rem 1.1rem; border-radius:.6rem; font-size:.86rem;
    cursor:pointer; box-shadow:0 6px 16px rgba(20,184,166,.25); }
  button.primary:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
  button.ghost { border:1px solid var(--border); background:var(--panel); color:var(--text);
    border-radius:.5rem; padding:.45rem .8rem; font-size:.8rem; cursor:pointer; }
  button.ghost:hover { border-color:var(--accent); color:var(--accent); }
  .statusbar { margin-top:.8rem; font-size:.8rem; color:var(--muted); display:flex;
    gap:.8rem; flex-wrap:wrap; align-items:center; }
  .statusbar .ok { color:var(--accent); font-weight:600; }
  .statusbar .bad { color:var(--err); font-weight:600; }
  .tabs { display:flex; gap:.35rem; flex-wrap:wrap; margin-bottom:.6rem; }
  .tabs button { border:1px solid var(--border); background:var(--panel); color:var(--muted);
    border-radius:.45rem; padding:.25rem .55rem; font-size:.76rem; cursor:pointer; }
  .tabs button.act { border-color:var(--accent); color:var(--accent); font-weight:600; }
  pre { margin:0; background:#0f172a; color:#e2e8f0; border-radius:.6rem; padding:.8rem 1rem;
    overflow:auto; max-height:34rem; font-size:.78rem; line-height:1.6; }
  textarea.out { width:100%; min-height:16rem; resize:vertical; border:none; background:var(--panel);
    color:var(--text); padding:1rem; font-size:.9rem; line-height:1.75;
    font-family:"Leelawadee UI","Noto Sans Thai",inherit; }
  .hidden { display:none !important; }
  .hint { color:var(--muted); font-size:.76rem; margin:.5rem 0 0; line-height:1.6; }
  .exports { display:flex; gap:.35rem; flex-wrap:wrap; margin-top:.6rem; }
  .exports a { text-decoration:none; font-size:.76rem; color:var(--accent); border:1px solid var(--border);
    border-radius:.4rem; padding:.2rem .55rem; background:var(--panel); }
  .exports a:hover { border-color:var(--accent); }
  .hint code { background:var(--panel2); border:1px solid var(--border); border-radius:.3rem; padding:.05rem .3rem; }
  @media (max-width:700px) { main { padding:1rem .9rem 3rem; } }
</style>
</head>
<body data-auth="{{ 1 if auth_required else 0 }}" data-version="{{ version }}">
<header>
  <div class="logo">OT</div>
  <h1>OpenThai2.0 OCR <small data-th="ทดสอบ API จริงจากเบราว์เซอร์" data-en="Call the real API from your browser">ทดสอบ API จริงจากเบราว์เซอร์</small></h1>
  <nav class="nav">
    <a href="/" data-th="OCR" data-en="OCR">OCR</a>
    <a href="/docs" data-th="สอนใช้ API" data-en="API guide">สอนใช้ API</a>
    <a href="/playground" class="act" data-th="ทดสอบ API" data-en="API playground">ทดสอบ API</a>
    <a href="/status" data-th="สถานะ" data-en="Status">สถานะ</a>
  </nav>
  <div class="head-actions">
    <button id="langBtn">EN</button>
    <span class="ver">v{{ version }}</span>
  </div>
</header>

<main>
  <div class="row">
    <div class="col">
      <div class="card">
        <h2><span data-th="คำขอ" data-en="Request">คำขอ</span></h2>
        <div class="body">
          <div class="drop" id="drop">
            <div class="big" data-th="ลากไฟล์มาวาง หรือคลิกเลือก" data-en="Drop a file here or click to choose">ลากไฟล์มาวาง หรือคลิกเลือก</div>
            <div class="sub" data-th="PNG / JPG / BMP / TIFF / WEBP / PDF" data-en="PNG / JPG / BMP / TIFF / WEBP / PDF">PNG / JPG / BMP / TIFF / WEBP / PDF</div>
            <input type="file" id="file" accept=".png,.jpg,.jpeg,.bmp,.tif,.tiff,.webp,.pdf" hidden>
          </div>
          <div class="grid">
            <label class="field"><span data-th="ความละเอียดภาพ" data-en="Image scale">ความละเอียดภาพ</span>
              <select id="scale">
                <option value="auto" data-th="อัตโนมัติ (แนะนำ)" data-en="Auto (recommended)">อัตโนมัติ (แนะนำ)</option>
                <option value="1">1×</option>
                <option value="1.5">1.5×</option>
                <option value="2">2×</option>
              </select>
            </label>
            <label class="field"><span data-th="settings (JSON, ไม่บังคับ)" data-en="settings (JSON, optional)">settings (JSON, ไม่บังคับ)</span>
              <textarea id="settings" spellcheck="false" placeholder='{"rec":{"drop_below":0.7}}'></textarea>
            </label>
            <label class="field hidden" id="keyField"><span data-th="API key (โหมด LAN)" data-en="API key (LAN mode)">API key (โหมด LAN)</span>
              <input type="password" id="apiKey" autocomplete="off">
            </label>
          </div>
          <div class="checks" style="margin-top:.7rem">
            <label><input type="checkbox" id="wantImages" checked>
              <span data-th="ขอภาพผลลัพธ์กลับมาด้วย" data-en="Return the annotated image">ขอภาพผลลัพธ์กลับมาด้วย</span></label>
          </div>
          <div class="actions">
            <button class="primary" id="run" disabled data-th="ยิงคำขอ OCR" data-en="Run OCR request">ยิงคำขอ OCR</button>
            <button class="ghost" id="healthBtn" data-th="ตรวจ /api/health" data-en="Check /api/health">ตรวจ /api/health</button>
            <button class="ghost" id="curlBtn" data-th="คัดลอกคำสั่ง curl" data-en="Copy curl">คัดลอกคำสั่ง curl</button>
          </div>
          <div class="statusbar" id="statusbar">
            <span id="stateDot" data-th="พร้อม" data-en="Ready">พร้อม</span>
            <span id="stateInfo"></span>
          </div>
          <p class="hint" data-th="คำขอนี้ยิงไปที่ API บนเครื่องคุณเอง (<code>/api/ocr</code>) — ถ้าเปิด LAN mode ต้องกรอก API key"
             data-en="This request hits your local API (<code>/api/ocr</code>) — fill the API key when LAN mode is on.">คำขอนี้ยิงไปที่ API บนเครื่องคุณเอง (<code>/api/ocr</code>) — ถ้าเปิด LAN mode ต้องกรอก API key</p>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <h2>
          <span data-th="คำตอบ" data-en="Response">คำตอบ</span>
          <span class="tabs" id="tabs">
            <button data-tab="text" class="act" data-th="ข้อความ" data-en="Text">ข้อความ</button>
            <button data-tab="json" data-th="JSON" data-en="JSON">JSON</button>
            <button data-tab="meta" data-th="สรุป" data-en="Summary">สรุป</button>
          </span>
        </h2>
        <div class="body">
          <div id="pane-text">
            <textarea class="out" id="outText" readonly placeholder="—"></textarea>
          </div>
          <div id="pane-json" class="hidden">
            <pre id="outJson">—</pre>
          </div>
          <div id="pane-meta" class="hidden">
            <pre id="outMeta">—</pre>
          </div>
          <div class="exports hidden" id="exports"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const I18N = {
    th: { ready: "พร้อม", running: "กำลังยิงคำขอ…", ok: "สำเร็จ", bad: "ผิดพลาด", noFile: "เลือกไฟล์ก่อน",
          copied: "คัดลอกแล้ว", copyFail: "คัดลอกไม่ได้", healthOk: "ระบบพร้อม", healthBad: "ระบบไม่พร้อม",
          needKey: "ต้องกรอก API key ก่อน", send: "ยิงคำขอ OCR" },
    en: { ready: "Ready", running: "Sending…", ok: "OK", bad: "Error", noFile: "Choose a file first",
          copied: "Copied", copyFail: "Copy failed", healthOk: "Service ready", healthBad: "Service not ready",
          needKey: "Enter the API key first", send: "Run OCR request" }
  };
  let lang = localStorage.getItem("ocrLang") || "th";
  const t = k => (I18N[lang] && I18N[lang][k]) || I18N.th[k] || k;

  const AUTH = document.body.dataset.auth === "1";
  const drop = document.getElementById("drop");
  const fileInput = document.getElementById("file");
  const runBtn = document.getElementById("run");
  const outText = document.getElementById("outText");
  const outJson = document.getElementById("outJson");
  const outMeta = document.getElementById("outMeta");
  const statusbar = document.getElementById("statusbar");
  const stateDot = document.getElementById("stateDot");
  const stateInfo = document.getElementById("stateInfo");
  const exportsBox = document.getElementById("exports");
  const keyField = document.getElementById("keyField");
  const apiKeyInput = document.getElementById("apiKey");
  const wantImages = document.getElementById("wantImages");
  const settingsBox = document.getElementById("settings");
  const scaleSel = document.getElementById("scale");

  let picked = null;
  let lastResult = null;

  if (AUTH) {
    keyField.classList.remove("hidden");
    apiKeyInput.value = localStorage.getItem("ocrApiKey") || "";
    apiKeyInput.addEventListener("change", () =>
      localStorage.setItem("ocrApiKey", apiKeyInput.value.trim()));
  }
  const apiKey = () => localStorage.getItem("ocrApiKey") || "";

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-th]").forEach(el => {
      el.innerHTML = lang === "en" ? el.dataset.en : el.dataset.th;
    });
    document.getElementById("langBtn").textContent = lang === "th" ? "EN" : "ไทย";
    if (runBtn.disabled && !picked) stateDot.textContent = t("ready");
  }
  document.getElementById("langBtn").onclick = () => {
    lang = lang === "th" ? "en" : "th";
    localStorage.setItem("ocrLang", lang);
    applyLang();
  };

  drop.addEventListener("click", () => fileInput.click());
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("on"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("on"));
  drop.addEventListener("drop", e => {
    e.preventDefault();
    drop.classList.remove("on");
    if (e.dataTransfer.files.length) pick(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) pick(fileInput.files[0]);
  });

  function pick(file) {
    picked = file;
    drop.querySelector(".big").textContent = file.name;
    drop.querySelector(".sub").textContent = (file.size / 1024 / 1024).toFixed(2) + " MB";
    runBtn.disabled = false;
  }

  function setState(text, kind) {
    stateDot.textContent = text;
    stateDot.className = kind === "ok" ? "ok" : kind === "bad" ? "bad" : "";
  }

  function showTab(name) {
    document.querySelectorAll("#tabs button").forEach(b =>
      b.classList.toggle("act", b.dataset.tab === name));
    document.getElementById("pane-text").classList.toggle("hidden", name !== "text");
    document.getElementById("pane-json").classList.toggle("hidden", name !== "json");
    document.getElementById("pane-meta").classList.toggle("hidden", name !== "meta");
  }
  document.getElementById("tabs").addEventListener("click", e => {
    const btn = e.target.closest("button[data-tab]");
    if (btn) showTab(btn.dataset.tab);
  });

  async function callOcr() {
    if (!picked) { setState(t("noFile"), "bad"); return; }
    if (AUTH && !apiKey()) { setState(t("needKey"), "bad"); return; }
    const form = new FormData();
    form.append("file", picked, picked.name);
    if (scaleSel.value !== "auto") form.append("scale", scaleSel.value);
    if (!wantImages.checked) form.append("images", "0");
    const settingsText = settingsBox.value.trim();
    if (settingsText) {
      try { JSON.parse(settingsText); } catch { setState("settings JSON ไม่ถูกต้อง / invalid JSON", "bad"); return; }
      form.append("settings", settingsText);
    }

    runBtn.disabled = true;
    setState(t("running"));
    stateInfo.textContent = "";
    const started = performance.now();
    try {
      const headers = {};
      if (AUTH && apiKey()) headers["X-API-Key"] = apiKey();
      const res = await fetch("/api/ocr", { method: "POST", body: form, headers });
      const elapsed = Math.round(performance.now() - started);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { raw: text }; }
      if (!res.ok || !data.ok) {
        setState(t("bad") + " HTTP " + res.status, "bad");
        outJson.textContent = JSON.stringify(data, null, 2);
        showTab("json");
        return;
      }
      lastResult = data;
      const page = data.pages[0] || {};
      outText.value = data.text || page.text || "";
      outJson.textContent = JSON.stringify(data, null, 2);
      const meta = {
        http: res.status, elapsed_ms: elapsed,
        version: document.body.dataset.version,
        pages: data.pages.length, lines: page.n_lines, scale: page.scale,
        confidence: page.confidence, timing: page.timing,
        result_id: data.result_id, text_length: (data.text || "").length
      };
      outMeta.textContent = JSON.stringify(meta, null, 2);
      exportsBox.innerHTML = ["txt", "docx", "pdf", "csv", "json"].map(f =>
        `<a href="/api/result/${data.result_id}/export?format=${f}">.${f}</a>`).join("");
      if (AUTH) {
        exportsBox.querySelectorAll("a").forEach(a => {
          a.addEventListener("click", async e => {
            e.preventDefault();
            const r = await fetch(a.getAttribute("href"), { headers: { "X-API-Key": apiKey() } });
            const blob = await r.blob();
            const url = URL.createObjectURL(blob);
            const el = document.createElement("a");
            el.href = url; el.download = "ocr." + a.textContent.slice(1); el.click();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          });
        });
      }
      exportsBox.classList.remove("hidden");
      setState(t("ok"), "ok");
      stateInfo.textContent = `HTTP ${res.status} · ${elapsed} ms · ${meta.pages} page(s) · ${meta.lines || 0} line(s)`;
      showTab("text");
    } catch (err) {
      setState(t("bad"), "bad");
      outJson.textContent = String(err);
      showTab("json");
    } finally {
      runBtn.disabled = false;
    }
  }
  runBtn.addEventListener("click", callOcr);

  document.getElementById("healthBtn").onclick = async () => {
    setState("…");
    const started = performance.now();
    try {
      const res = await fetch("/api/health");
      const data = await res.json();
      const elapsed = Math.round(performance.now() - started);
      outMeta.textContent = JSON.stringify(data, null, 2);
      showTab("meta");
      const ok = data.ok && data.model_ready;
      setState(ok ? t("healthOk") : t("healthBad"), ok ? "ok" : "bad");
      stateInfo.textContent = `HTTP ${res.status} · ${elapsed} ms · v${data.version}`;
    } catch (err) {
      setState(t("healthBad"), "bad");
      stateInfo.textContent = String(err);
    }
  };

  document.getElementById("curlBtn").onclick = async () => {
    const origin = location.origin;
    const parts = [`curl -s -X POST ${origin}/api/ocr`];
    parts.push(`-F "file=@${picked ? picked.name : "file.png"}"`);
    if (scaleSel.value !== "auto") parts.push(`-F "scale=${scaleSel.value}"`);
    if (!wantImages.checked) parts.push(`-F "images=0"`);
    if (settingsBox.value.trim()) parts.push(`-F 'settings=${settingsBox.value.trim()}'`);
    if (AUTH) parts.push(`-H "X-API-Key: YOUR_KEY"`);
    try {
      await navigator.clipboard.writeText(parts.join(" \\\n  "));
      stateInfo.textContent = t("copied");
    } catch {
      outText.value = parts.join(" \\\n  ");
      stateInfo.textContent = t("copyFail");
      showTab("text");
    }
  };

  applyLang();
</script>
</body>
</html>
